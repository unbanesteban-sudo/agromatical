<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Agromatical</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="login-body">

  <div class="login-layout">
    <div class="login-lado-logo">
      <div class="login-marca">
        <svg width="72" height="72" viewBox="0 0 32 32" aria-hidden="true"><path d="M4.5 27V14.5L16 6l11.5 8.5V27" fill="#eef5ea" stroke="#2e6b34" stroke-width="2.2" stroke-linejoin="round"/><path d="M2.5 27h27" stroke="#2e6b34" stroke-width="2.2" stroke-linecap="round"/><path d="M16 27v-8" stroke="#2e6b34" stroke-width="2" stroke-linecap="round"/><path d="M16 21c-4 0-6.2-2.4-6.2-6 4 0 6.2 2.4 6.2 6z" fill="#7fb069"/><path d="M16 19c0-4 2.4-6.6 6.4-6.6 0 4-2.4 6.6-6.4 6.6z" fill="#2e6b34"/></svg>
        <p class="login-marca-nombre"><strong>Agro</strong>matical</p>
        <p class="login-marca-lema">Tecnología que cultiva el futuro</p>
      </div>

      <ul class="login-funciones">
        <li><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg></span>La temperatura y humedad de tu invernadero, en vivo</li>
        <li><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/><path d="M9 14.5a3 3 0 0 0 3 3"/></svg></span>Horarios de riego según el clima de cada día</li>
        <li><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H9l-5 4v-14z"/></svg></span>AgrIA, para preguntar lo que quieras de tus plantas</li>
      </ul>
    </div>

    <div class="login-lado-form">
      <div class="login-card">
        <svg class="login-logo-chico" width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><path d="M4.5 27V14.5L16 6l11.5 8.5V27" fill="#eef5ea" stroke="#2e6b34" stroke-width="2.2" stroke-linejoin="round"/><path d="M2.5 27h27" stroke="#2e6b34" stroke-width="2.2" stroke-linecap="round"/><path d="M16 27v-8" stroke="#2e6b34" stroke-width="2" stroke-linecap="round"/><path d="M16 21c-4 0-6.2-2.4-6.2-6 4 0 6.2 2.4 6.2 6z" fill="#7fb069"/><path d="M16 19c0-4 2.4-6.6 6.4-6.6 0 4-2.4 6.6-6.4 6.6z" fill="#2e6b34"/></svg>
        <h1>Bienvenido a Agromatical</h1>
        <p class="login-sub">Entrá para cuidar tu invernadero.</p>

        <div class="login-tabs">
          <button type="button" id="tabEntrar" class="activo" onclick="cambiarModoLogin('entrar')">Iniciar sesión</button>
          <button type="button" id="tabCrear" onclick="cambiarModoLogin('crear')">Crear cuenta</button>
        </div>

        <div class="form-field" id="campoNombre" style="display:none;">
          <label for="loginNombre">Tu nombre</label>
          <input type="text" id="loginNombre" placeholder="Ej: Esteban" autocomplete="name">
        </div>

        <div class="form-field">
          <label for="loginMail">Mail</label>
          <input type="email" id="loginMail" placeholder="tumail@gmail.com" autocomplete="email">
        </div>

        <div class="form-field">
          <label for="loginClave">Contraseña</label>
          <input type="password" id="loginClave" placeholder="Mínimo 6 caracteres" autocomplete="current-password" onkeypress="teclaLogin(event)">
        </div>

        <p class="login-mensaje" id="loginMensaje"></p>

        <button type="button" class="login-btn" id="loginBoton" onclick="enviarLogin()">Iniciar sesión</button>

        <div class="login-separador">o</div>

        <button type="button" class="login-btn-invitado" onclick="entrarComoInvitado()">Entrar como invitado</button>

        <p class="login-olvide"><button type="button" onclick="recuperarClave()">¿Te olvidaste la contraseña?</button></p>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
